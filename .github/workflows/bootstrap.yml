name: Bootstrap

# One-off: generates the Flutter platform folders and pubspec on a machine
# with the Flutter SDK and pushes them to the `generated` branch, so they
# can be merged into main.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate project
        run: |
          flutter create --org hr.climbingjournal --project-name climbing_journal --platforms=android,ios,web .
          rm -f test/widget_test.dart
          flutter pub add firebase_core firebase_auth cloud_firestore uuid geolocator pdf printing
          flutter --version > flutter-version.txt

      - name: Push to the generated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B generated
          git add pubspec.yaml pubspec.lock analysis_options.yaml .metadata android ios web flutter-version.txt
          git commit -m "Generate Flutter platform files and pubspec"
          git push --force origin generated
