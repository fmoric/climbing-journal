name: Build

# Compiles and tests the app on every push and pull request.
# Platform folders and pubspec are generated here the same way setup.sh does
# locally, so CI always checks the code against current package versions.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate project files
        run: |
          flutter create --org hr.climbingjournal --project-name climbing_journal --platforms=android,ios .
          rm -f test/widget_test.dart
          flutter pub add firebase_core firebase_auth cloud_firestore uuid

      - name: Firebase options stub (CI only)
        # The real file comes from `flutterfire configure` and holds project keys.
        # CI only needs it to compile; this stub is never committed.
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cp ci/firebase_options_stub.dart lib/firebase_options.dart
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: climbing-journal-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
