name: Build

# Analyze, test and build the Android APK. On main, also publish the APK
# as the "latest" release (direct download link), and to GitHub Pages the
# web demo (/climbing-journal/) and the installable web app (/app/).

# Runs only when started by hand (Actions tab → Build → Run workflow, or
# the API), so routine pushes and docs changes cost no Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Firebase options stub (CI only)
        # The real file comes from `flutterfire configure`. CI only needs it
        # to compile; the stub is never committed.
        run: |
          if [ ! -f lib/firebase_options.dart ]; then
            cp ci/firebase_options_stub.dart lib/firebase_options.dart
          fi

      - run: flutter pub get

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log

      - name: Report analyzer errors as annotations
        if: failure()
        run: |
          if [ -f analyze.log ]; then
            python3 -c "import sys;m=open('analyze.log').read()[-60000:];print('::error title=flutter analyze::'+m.replace('%','%25').replace('\\n','%0A'))"
          fi

      - name: Test
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log

      - name: Report test failures as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          lines = open('test.log', encoding='utf-8', errors='replace').read().splitlines()
          keep, left = [], 0
          for l in lines:
              if 'EXCEPTION CAUGHT' in l or '[E]' in l:
                  left = 14
              if left > 0 and l.strip():
                  keep.append(l[:240])
                  left -= 1
          keep += lines[-3:]
          msg = '\n'.join(keep)[-60000:]
          msg = msg.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=flutter test::' + msg)
          PY

      - name: Build APK
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk climbing-journal.apk

      - uses: actions/upload-artifact@v7
        with:
          name: climbing-journal-apk
          path: climbing-journal.apk
          retention-days: 14

      - name: Publish APK as the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest climbing-journal.apk \
            --target "$GITHUB_SHA" \
            --title "Climbing Journal · build ${{ github.run_number }}" \
            --notes "Latest build from main (${GITHUB_SHA::7}). Install climbing-journal.apk on Android; it updates the installed app and keeps your logbook."

      - name: Build web demo
        run: |
          flutter build web --release --dart-define=DEMO=true --base-href /climbing-journal/
          python3 ci/web-app/prepare.py build/web demo

      - name: Build web app (local mode, installable, offline)
        run: |
          flutter build web --release --pwa-strategy=none --no-web-resources-cdn \
            --base-href /climbing-journal/app/ --output build/web-app
          python3 ci/web-app/prepare.py build/web-app app
          rm -rf build/web/app
          cp -r build/web-app build/web/app

      - name: Publish web demo and app to the gh-pages branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web demo from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
